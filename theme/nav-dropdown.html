<script>
// Make dropdown parent links clickable on desktop (hover opens dropdown, click navigates)
document.addEventListener('DOMContentLoaded', function () {
  var dropdownTargets = {
    'Team': './team.html'
  };

  document.querySelectorAll('.navbar .nav-item.dropdown > .nav-link.dropdown-toggle').forEach(function (toggle) {
    var label = toggle.textContent.trim();
    var target = dropdownTargets[label];
    if (!target) return;

    toggle.setAttribute('href', target);

    toggle.addEventListener('click', function (e) {
      if (window.innerWidth >= 992) {
        window.location.href = target;
      }
    });
  });
});
</script>
