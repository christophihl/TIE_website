<script>
document.addEventListener('DOMContentLoaded', function () {
  var dropdownTargets = {
    'Team': './team.html'
  };

  document.querySelectorAll('.navbar .nav-item.dropdown > .nav-link.dropdown-toggle').forEach(function (toggle) {
    var label = toggle.textContent.trim();
    var target = dropdownTargets[label];
    if (!target) return;

    toggle.setAttribute('href', target);

    // Inject upper-right arrow image after the menu text
    var arrow = document.createElement('img');
    arrow.src = './assets/images/link_blue.svg';
    arrow.className = 'dropdown-nav-arrow';
    arrow.alt = '';
    toggle.appendChild(arrow);

    // Track whether dropdown was open BEFORE Bootstrap processes the click
    var wasOpen = false;
    toggle.addEventListener('mousedown', function () {
      wasOpen = toggle.getAttribute('aria-expanded') === 'true';
    });

    toggle.addEventListener('click', function (e) {
      if (window.innerWidth >= 992) {
        // Desktop: always navigate (hover handles dropdown)
        window.location.href = target;
      } else {
        // Mobile: if it was already open before this click, navigate
        if (wasOpen) {
          e.preventDefault();
          e.stopImmediatePropagation();
          window.location.href = target;
        }
        // Otherwise: let Bootstrap open the dropdown
      }
    });
  });

  // Close dropdown + mobile navbar when any dropdown item is clicked
  document.querySelectorAll('.navbar .dropdown-item').forEach(function (item) {
    item.addEventListener('click', function () {
      var menu = item.closest('.dropdown-menu');
      if (menu) menu.classList.remove('show');
      var toggle = item.closest('.nav-item.dropdown').querySelector('.dropdown-toggle');
      if (toggle) {
        toggle.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
      if (window.innerWidth < 992) {
        var collapse = document.querySelector('.navbar-collapse.show');
        if (collapse) {
          var bsCollapse = bootstrap.Collapse.getInstance(collapse);
          if (bsCollapse) bsCollapse.hide();
        }
      }
    });
  });
});
</script>
