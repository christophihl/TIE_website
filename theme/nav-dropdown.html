<script>
document.addEventListener('DOMContentLoaded', function () {
  // Make dropdown parent links clickable on desktop
  var dropdownTargets = {
    'Team': './team.html'
  };

  document.querySelectorAll('.navbar .nav-item.dropdown > .nav-link.dropdown-toggle').forEach(function (toggle) {
    var label = toggle.textContent.trim();
    var target = dropdownTargets[label];
    if (!target) return;

    toggle.setAttribute('href', target);

    toggle.addEventListener('click', function (e) {
      if (window.innerWidth >= 992) {
        window.location.href = target;
      }
    });
  });

  // Close dropdown + mobile navbar when any dropdown item or parent link is clicked
  document.querySelectorAll('.navbar .dropdown-item').forEach(function (item) {
    item.addEventListener('click', function () {
      // Close the Bootstrap dropdown
      var menu = item.closest('.dropdown-menu');
      if (menu) menu.classList.remove('show');
      var toggle = item.closest('.nav-item.dropdown').querySelector('.dropdown-toggle');
      if (toggle) {
        toggle.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
      // On mobile: also collapse the navbar
      if (window.innerWidth < 992) {
        var collapse = document.querySelector('.navbar-collapse.show');
        if (collapse) {
          var bsCollapse = bootstrap.Collapse.getInstance(collapse);
          if (bsCollapse) bsCollapse.hide();
        }
      }
    });
  });
});
</script>
